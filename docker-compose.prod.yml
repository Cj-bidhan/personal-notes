version: '3.8'

services:
  backend:
    image: ${BACKEND_IMAGE}:${BACKEND_TAG}
    container_name: personal-notes-backend
    restart: always
    env_file:
      - ./server/.env
    expose:
      - "5000"

  frontend:
    image: ${FRONTEND_IMAGE}:${FRONTEND_TAG}
    container_name: personal-notes-frontend
    restart: always
    expose:
      - "80"

  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
