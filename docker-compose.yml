version: '3.8'

services:
  backend:
    build:
      context: ./server
    container_name: personal-notes-backend
    restart: always
    env_file:
      - ./server/.env
    expose:
      - "5000"  # internal only

  frontend:
    build:
      context: ./client
    container_name: personal-notes-frontend
    restart: always
    expose:
      - "80"    # internal only

  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    entrypoint: ""
